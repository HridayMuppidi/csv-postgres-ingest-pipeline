 
services:
  csv_postgres_ingest_pipeline:
    build:
      context: .
    depends_on:
      - postgres_database
    env_file:
      - .env
    environment:
      - DB_HOST=postgres_database
  postgres_database: 
    image: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
